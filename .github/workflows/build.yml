name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p planetext --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The cached install metadata can outlive the binaries themselves,
          # which then makes binstall skip an install that is not there.
          cache-bin: false
      - uses: cargo-bins/cargo-binstall@main
      - name: Install build tools
        run: cargo binstall -y --locked --force trunk tauri-cli@^2
      - name: Build Planetext
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: planetext-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  windows-gpui:
    name: Windows GPUI build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: cargo-bins/cargo-binstall@main
      - name: Install build tools
        run: cargo binstall -y --locked --force trunk
      # GPUI 版は dist/ を実行時に実行ファイルの隣から読むため、
      # フロントエンドを先に作ってから exe と同じ場所へ並べます。
      - name: Build the frontend
        run: trunk build --release
      - name: Build the GPUI shell
        run: cargo build -p planetext-gpui --release
      - name: Lay out the distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path planetext-gpui-windows | Out-Null
          Copy-Item target/release/planetext-gpui.exe planetext-gpui-windows/
          Copy-Item -Recurse dist planetext-gpui-windows/dist
      - uses: actions/upload-artifact@v4
        with:
          name: planetext-gpui-windows
          path: planetext-gpui-windows/**
          if-no-files-found: error
