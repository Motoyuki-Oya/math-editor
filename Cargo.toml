[package]
name = "planetext-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
regex = "1.13.1"
memchr = "2.8.3"
unicode-normalization = "0.1.24"
toml = "0.8"

[dependencies.web-sys]
version = "0.3"
features = [
  "ClipboardEvent",
  "CompositionEvent",
  "console",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "DomRect",
  "DragEvent",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusEvent",
  "HtmlCollection",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "InputEvent",
  "KeyboardEvent",
  "MouseEvent",
  "Node",
  "WheelEvent",
  "NodeList",
  "PointerEvent",
  "Range",
  "Selection",
  "Text",
  "Window",
]

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
javascriptcore-rs = "1.1.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["crates/planetext-document", "src-tauri"]
