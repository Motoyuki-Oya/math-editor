[workspace]
resolver = "2"
members = ["crates/planetext-document", "crates/planetext-ui", "src-tauri"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 開発（Debugビルド）時でも、memchr等の外部走査ライブラリのみ最高速最適化（SIMD）を有効化する。
# アプリ本体のデバッグ容易性（ブレークポイント・スタックトレース等）は維持される。
[profile.dev.package."*"]
opt-level = 3
