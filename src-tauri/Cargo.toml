[package]
name = "planetext"
version = "0.1.0"
description = "数式を記法を意識せずに書けるテキストエディタ"
authors = ["Motoyuki-Oya"]
edition = "2021"

[lib]
# `_lib` サフィックスは冗長に見えるかもしれませんが、lib 名を一意にし、bin 名と競合しないようにする必要があります。これは Windows のみの問題のようです。https://github.com/rust-lang/cargo/issues/8519 を参照してください。
name = "planetext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
